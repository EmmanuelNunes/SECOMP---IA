<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0b1018"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#85c6bc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#85c6bc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b1018" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#243042" opacity="0.45"/>
    </pattern>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
      
    </style>
  </defs>

  <rect width="1600" height="680" fill="url(#bgGrad)"/>
  <rect width="1600" height="680" fill="url(#dotGrid)"/>

  <!-- Top Badge -->
  <g transform="translate(100, 90)">
    <rect x="0" y="0" width="340" height="32" rx="6" fill="#141c28" stroke="#29374c" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="5" fill="#85c6bc"/>
    <text x="32" y="21" class="font-mono" font-size="12" font-weight="700" fill="#85c6bc" letter-spacing="1.5">AI & AUTONOMOUS AGENTS MASTERCLASS</text>
  </g>

  <!-- Right Meta -->
  <g transform="translate(1120, 90)">
    <text x="380" y="21" text-anchor="end" class="font-mono" font-size="12" fill="#71869f" letter-spacing="2">EMMANUEL NUNES ECOSYSTEM</text>
  </g>

  <!-- Main Hero Titles -->
  <g transform="translate(100, 210)">
    <text x="0" y="0" class="font-mono" font-size="14" font-weight="700" fill="#85c6bc" letter-spacing="3">Mira D3.js</text>
    <text x="0" y="90" class="font-sans" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-2">Workshop SECOMP 2026</text>
    <text x="0" y="170" class="font-sans" font-size="20" fill="#9db1c8" font-weight="400">Materiais teóricos, laboratórios práticos e projeto integrador Career-AI.</text>
    
    <!-- Pills -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="160" height="34" rx="17" fill="#152132" stroke="#2d4263" stroke-width="1"/>
      <text x="80" y="21" text-anchor="middle" class="font-mono" font-size="12" fill="#85c6bc" font-weight="600">Mira D3.js</text>

      <rect x="175" y="0" width="180" height="34" rx="17" fill="#152132" stroke="#2d4263" stroke-width="1"/>
      <text x="265" y="21" text-anchor="middle" class="font-mono" font-size="12" fill="#ffffff" font-weight="600">ChromaDB RAG</text>

      <rect x="370" y="0" width="180" height="34" rx="17" fill="#152132" stroke="#2d4263" stroke-width="1"/>
      <text x="460" y="21" text-anchor="middle" class="font-mono" font-size="12" fill="#85c6bc" font-weight="600">Career-AI</text>
    </g>
  </g>

  <!-- Right Visual -->
  <g transform="translate(0, 0)">
    <circle cx="1250" cy="340" r="220" fill="url(#portalGlow)"/>
    <circle cx="1250" cy="340" r="180" fill="none" stroke="#243347" stroke-width="1.5" stroke-dasharray="6 8"/>
    
    <g class="orbit-ring">
      <circle cx="1250" cy="340" r="140" fill="none" stroke="#2f425b" stroke-width="1.8"/>
      <circle cx="1390" cy="340" r="7" fill="#85c6bc"/>
      <circle cx="1110" cy="340" r="5" fill="#ffffff"/>
    </g>

    <g class="pulse-core">
      <circle cx="1250" cy="340" r="60" fill="#101926" stroke="#85c6bc" stroke-width="2.5"/>
      <text x="1250" y="348" text-anchor="middle" class="font-mono" font-size="14" font-weight="700" fill="#85c6bc">SYSTEM</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <line x1="100" y1="600" x2="1500" y2="600" stroke="#1d2737" stroke-width="1.5"/>
  <g transform="translate(100, 630)">
    <text x="0" y="0" class="font-mono" font-size="12" fill="#6d839c">VERIFIED · OPEN SOURCE · HIGH QUALITY BAR</text>
    <text x="1400" y="0" text-anchor="end" class="font-mono" font-size="12" font-weight="700" fill="#85c6bc" letter-spacing="2">BUILD WITH INTENT. SHIP WITH FLOW.</text>
  </g>
</svg>
